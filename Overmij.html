    <title>Over mij - Joëlle's Craft Room</title>
  </head>

  <body>
    <header>
      <!-- Ik zet mijn logo met afbeelding bovenaan de pagina. -->
      <img
        id="logo"
        src="./kleineafbeeldingen/logo200.png"
        alt="Joëlle's Craft Room logo"
      />

      <!-- Dit menu gebruik ik op kleinere schermen, zodat de navigatie klein en heel blijft. -->
      <details class="mobiel-menu">
        <summary>☰ Menu</summary>
        <nav>
          <a href="index.html">Joëlle's craft room</a>
          <a href="Overmij.html" aria-current="page">Over mij</a>
          <a href="creaties.html">Mijn creaties</a>
          <a href="inspiratie.html">Inspiratie</a>
          <a href="./freezing/freezing.html">Freezing</a>
        </nav>
      </details>

      <!-- Dit is de navigatie die zichtbaar is op grotere schermen. -->

        <a href="index.html">Joëlle's craft room</a>
        <a href="Overmij.html" aria-current="page">Over mij</a>
        <a href="creaties.html">Mijn creaties</a>
        <a href="inspiratie.html">Inspiratie</a>
        <a href="./freezing/freezing.html">Freezing</a>
      </nav>

      <h1>Over mij</h1>
    </header>

    <main>
      <img
        id="selfie"
        src="./kleineafbeeldingen/selfie.jpg"
        alt="Foto van Joëlle"
      />

      <!-- Ik gebruik een figure om mijn verhaal over een decoratieve achtergrond te plaatsen. -->
      <figure class="verhaal">
        <img
          class="verhaal-achtergrond"
          src="./kleineafbeeldingen/Paginanieuw.jpg"
          alt="pagina"
        />
        <p>
          <!-- Ik gebruik een versierde beginletter om mijn verhaal een sprookjesachtige uitstraling te geven. -->
          <img
            class="beginletter"
            src="./kleineafbeeldingen/letterE.png"
            alt="De letter E mooi gedecoreerd"
          />
          r was eens een meisje met een hoofd vol ideeën en een hart vol
          nieuwsgierigheid. Op haar 13e vroeg zij haar moeder om een
          naaimachine. Ze had nog niet veel ervaring met naaien, maar wilde
          graag leren hoe ze zelf kleding kon maken. Met deze naaimachine maakte
          zij haar eerste kledingstukken en ontdekte ze hoeveel plezier ze
          hieruit haalde. Tijdens de lockdown had zij extra veel vrije tijd. Ze
          begon steeds meer te naaien en maakte onder andere verschillende
          prinsessenjurken. Ze vond het leuk om zelf te bedenken hoe een jurk
          eruit moest zien en deze vervolgens helemaal zelf te maken. Soms lukte
          iets niet meteen, maar door veel te oefenen leerde ze steeds meer. Na
          verloop van tijd werd naaien een vaste hobby. Inmiddels vindt ze het
          geweldig om nieuwe kledingstukken te ontwerpen en te maken. Elk
          project is weer anders en brengt nieuwe uitdagingen met zich mee.
          Wanneer ze een nieuw idee heeft, begint ze vaak met een schets. Daarna
          gaat ze op zoek naar de juiste stoffen en materialen en begint ze met
          het maken van haar creatie. Wat ooit begon met één naaimachine en een
          nieuwsgierig meisje, is uitgegroeid tot een hobby waar ze nog steeds
          met veel plezier aan werkt.
        </p>
      </figure>
    </main>

    <!-- Hier laad ik mijn JavaScript-bestand in voor de interactieve onderdelen van mijn website. -->
    <script src="assets/script.js" defer></script>

    <!-- Dit script zorgt voor de sparkle-effecten op mijn website. -->
    <script src="assets/sparkles.js"></script>

    <!-- Hiermee zet ik de sparkle-effecten aan. -->
    <script>
      sparkle(true);
    </script>
  </body>
</html>
